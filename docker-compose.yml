# EveryAPI BYO-GPU supplier bundle.
#
# Image: ghcr.io/everyapi-ai/everyapi-edge (Apache 2.0, source at
# https://github.com/everyapi-ai/everyapi-edge).
#
# Two services: ollama serves OpenAI-compatible inference on
# :11434, the agent connects out to the EveryAPI gateway and
# forwards every inbound buyer request to ollama. No port is
# exposed to the public internet — all traffic is the agent's
# outbound WebSocket.
#
# First-run setup:
#   1. Copy .env.example to .env (or pass via the environment)
#   2. Get an EVERYAPI_NODE_ID + EVERYAPI_REGISTRATION_TOKEN from
#      the EveryAPI dashboard: /seller/edge/nodes → New node
#   3. docker compose up -d
#   4. Verify the dashboard shows the node as "online" within ~30s
#
# After the first successful connect, EVERYAPI_REGISTRATION_TOKEN
# is consumed server-side and can be removed from .env. Reconnects
# use the Ed25519 identity at ./data/identity.json.

services:
  diffusers:
    build: ./diffusers
    container_name: everyapi-edge-diffusers
    restart: unless-stopped
    environment:
      EVERYAPI_DIFFUSERS_MODEL: ${EVERYAPI_DIFFUSERS_MODEL:-Qwen/Qwen-Image-Edit-2511}
      EVERYAPI_VRAM_GB: ${EVERYAPI_VRAM_GB:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${EVERYAPI_IMAGE_MODEL_PATH:-${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}/images}:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8188/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20m

  speech:
    build: ./speech
    container_name: everyapi-edge-speech
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    # Kokoro-82M peaks under 1 GiB of VRAM, so it shares the card with ollama and diffusers instead of needing one of its own.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${EVERYAPI_SPEECH_MODEL_PATH:-${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}/speech}:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8189/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20m

  ollama:
    image: ollama/ollama:latest
    container_name: everyapi-edge-ollama
    restart: unless-stopped
    environment:
      # Do not let independent buyer requests make several large models
      # resident at once. The dashboard's live budget covers headroom; this
      # is the runtime backstop between refreshes.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MODELS: /models
    # GPU passthrough. Required for any meaningful inference work;
    # the agent will technically still run without it but will be
    # serving from CPU and that's not what this bundle is for.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}:/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    image: ghcr.io/everyapi-ai/everyapi-edge:${EVERYAPI_EDGE_VERSION:-latest}
    container_name: everyapi-edge-agent
    restart: unless-stopped
    depends_on:
      diffusers:
        condition: service_healthy
      speech:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      EVERYAPI_GATEWAY: ${EVERYAPI_GATEWAY:?gateway URL required}
      EVERYAPI_NODE_ID: ${EVERYAPI_NODE_ID:?node id required}
      EVERYAPI_REGISTRATION_TOKEN: ${EVERYAPI_REGISTRATION_TOKEN:-}
      OLLAMA_URL: http://ollama:11434
      EVERYAPI_OLLAMA_STORAGE_PATH: /models
      EVERYAPI_DIFFUSERS_URL: http://diffusers:8188
      EVERYAPI_SPEECH_URL: http://speech:8189
      EVERYAPI_IDENTITY_PATH: /var/lib/everyapi-edge/identity.json
      EVERYAPI_NODE_NAME: ${EVERYAPI_NODE_NAME:-}
      EVERYAPI_GPU_MODEL: ${EVERYAPI_GPU_MODEL:-}
      EVERYAPI_VRAM_GB: ${EVERYAPI_VRAM_GB:-}
      EVERYAPI_COUNTRY: ${EVERYAPI_COUNTRY:-}
      EVERYAPI_WORKLOADS: ${EVERYAPI_WORKLOADS:-}
      EVERYAPI_CONSOLE_ADDR: 0.0.0.0:8421
    volumes:
      - ./data/agent:/var/lib/everyapi-edge
    ports:
      # Local-network management surface. It has no login because it is for
      # the supplier's trusted LAN; never expose this port to the Internet.
      - "${EVERYAPI_CONSOLE_PORT:-8421}:8421"
