# EveryAPI BYO-GPU supplier bundle — AMD ROCm variant.
#
# Identical to docker-compose.yml except the GPU passthrough block
# uses ROCm devices (/dev/kfd, /dev/dri) and the `video` group
# instead of the NVIDIA container runtime. Use this on AMD Radeon
# Instinct / RX 7000 / RX 6000 setups with ROCm 5.7+ installed
# on the host.
#
# Pick by file:
#   docker compose -f docker-compose.rocm.yml up -d
#
# Or rename to docker-compose.yml if you want the default
# `docker compose up` invocation to work.

services:
  diffusers:
    build:
      context: ./diffusers
      dockerfile: Dockerfile.rocm
    container_name: everyapi-edge-diffusers
    restart: unless-stopped
    environment:
      EVERYAPI_DIFFUSERS_MODEL: ${EVERYAPI_DIFFUSERS_MODEL:-Qwen/Qwen-Image-Edit-2511}
      EVERYAPI_VRAM_GB: ${EVERYAPI_VRAM_GB:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    volumes:
      - ${EVERYAPI_IMAGE_MODEL_PATH:-${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}/images}:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8188/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20m

  speech:
    build:
      context: ./speech
      dockerfile: Dockerfile.rocm
    container_name: everyapi-edge-speech
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      EVERYAPI_TTS_DEVICE: ${EVERYAPI_TTS_DEVICE:-cpu}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    volumes:
      - ${EVERYAPI_SPEECH_MODEL_PATH:-${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}/speech}:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8189/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20m

  transcription:
    build:
      context: ./transcription
      dockerfile: Dockerfile.rocm
    container_name: everyapi-edge-transcription
    restart: unless-stopped
    environment:
      EVERYAPI_TRANSCRIPTION_MODEL: ${EVERYAPI_TRANSCRIPTION_MODEL:-openai/whisper-small}
      HF_TOKEN: ${HF_TOKEN:-}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    volumes:
      - ${EVERYAPI_TRANSCRIPTION_MODEL_PATH:-${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}/transcription}:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8190/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20m

  video:
    build:
      context: ./video
      dockerfile: Dockerfile.rocm
    container_name: everyapi-edge-video
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    volumes:
      - ${EVERYAPI_VIDEO_MODEL_PATH:-${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}/video}:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8191/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20m

  render:
    build: ./render
    container_name: everyapi-edge-render
    restart: unless-stopped
    environment:
      EVERYAPI_COMFYUI_URL: ${EVERYAPI_COMFYUI_URL:-http://host.docker.internal:8188}
    volumes:
      - ${EVERYAPI_RENDER_WORKFLOW_PATH:-./data/render-workflows}:/workflows:ro
      - ./data/render:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rerank:
    build:
      context: ./rerank
      dockerfile: Dockerfile.rocm
    container_name: everyapi-edge-rerank
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    volumes:
      - ${EVERYAPI_RERANK_MODEL_PATH:-${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}/rerank}:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8193/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20m

  ollama:
    image: ollama/ollama:rocm
    container_name: everyapi-edge-ollama
    restart: unless-stopped
    environment:
      # Backstop the live capacity guard: one model may remain resident.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MODELS: /models
    # ROCm passthrough — exposes the AMD GPU devices to the
    # container. Requires the host to have ROCm 5.7+ + rocm-dkms
    # installed; verify with `rocminfo` on the host before
    # bringing this up.
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    # SYS_PTRACE is needed by ROCm's profiler tooling that ollama
    # uses for kernel scheduling. Without it ollama still runs but
    # falls back to slower paths on some kernel versions.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - ${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}:/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    image: ghcr.io/everyapi-ai/everyapi-edge:${EVERYAPI_EDGE_VERSION:-latest}
    container_name: everyapi-edge-agent
    restart: unless-stopped
    depends_on:
      diffusers:
        condition: service_healthy
      speech:
        condition: service_healthy
      transcription:
        condition: service_healthy
      video:
        condition: service_healthy
      rerank:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      EVERYAPI_GATEWAY: ${EVERYAPI_GATEWAY:?gateway URL required}
      EVERYAPI_NODE_ID: ${EVERYAPI_NODE_ID:?node id required}
      EVERYAPI_REGISTRATION_TOKEN: ${EVERYAPI_REGISTRATION_TOKEN:-}
      OLLAMA_URL: http://ollama:11434
      EVERYAPI_DIFFUSERS_URL: http://diffusers:8188
      EVERYAPI_SPEECH_URL: http://speech:8189
      EVERYAPI_TRANSCRIPTION_URL: http://transcription:8190
      EVERYAPI_VIDEO_URL: http://video:8191
      EVERYAPI_RENDER_URL: http://render:8192
      EVERYAPI_RERANK_URL: http://rerank:8193
      EVERYAPI_OLLAMA_STORAGE_PATH: /models
      EVERYAPI_IDENTITY_PATH: /var/lib/everyapi-edge/identity.json
      EVERYAPI_NODE_NAME: ${EVERYAPI_NODE_NAME:-}
      EVERYAPI_GPU_MODEL: ${EVERYAPI_GPU_MODEL:-}
      EVERYAPI_VRAM_GB: ${EVERYAPI_VRAM_GB:-}
      EVERYAPI_COUNTRY: ${EVERYAPI_COUNTRY:-}
      EVERYAPI_WORKLOADS: ${EVERYAPI_WORKLOADS:-}
      EVERYAPI_MAX_CONCURRENT_REQUESTS: ${EVERYAPI_MAX_CONCURRENT_REQUESTS:-4}
      EVERYAPI_MAX_CONCURRENT_TEXT: ${EVERYAPI_MAX_CONCURRENT_TEXT:-4}
      EVERYAPI_MAX_CONCURRENT_IMAGE: ${EVERYAPI_MAX_CONCURRENT_IMAGE:-1}
      EVERYAPI_MAX_CONCURRENT_SPEECH: ${EVERYAPI_MAX_CONCURRENT_SPEECH:-2}
      EVERYAPI_MAX_CONCURRENT_VIDEO: ${EVERYAPI_MAX_CONCURRENT_VIDEO:-1}
      EVERYAPI_MAX_CONCURRENT_RENDER: ${EVERYAPI_MAX_CONCURRENT_RENDER:-1}
      EVERYAPI_MAX_CONCURRENT_RERANK: ${EVERYAPI_MAX_CONCURRENT_RERANK:-2}
      EVERYAPI_RESERVE_VRAM_MB_TEXT: ${EVERYAPI_RESERVE_VRAM_MB_TEXT:-0}
      EVERYAPI_RESERVE_VRAM_MB_IMAGE: ${EVERYAPI_RESERVE_VRAM_MB_IMAGE:-0}
      EVERYAPI_RESERVE_VRAM_MB_SPEECH: ${EVERYAPI_RESERVE_VRAM_MB_SPEECH:-0}
      EVERYAPI_RESERVE_VRAM_MB_VIDEO: ${EVERYAPI_RESERVE_VRAM_MB_VIDEO:-0}
      EVERYAPI_RESERVE_VRAM_MB_RENDER: ${EVERYAPI_RESERVE_VRAM_MB_RENDER:-0}
      EVERYAPI_RESERVE_VRAM_MB_RERANK: ${EVERYAPI_RESERVE_VRAM_MB_RERANK:-0}
      EVERYAPI_CONSOLE_ADDR: 0.0.0.0:8421
      EVERYAPI_CONSOLE_TOKEN: ${EVERYAPI_CONSOLE_TOKEN:?console token required}
    volumes:
      - ./data/agent:/var/lib/everyapi-edge
      - ${EVERYAPI_MODEL_PATH:-${HOME}/.everyapi/edge}:/models
    ports:
      # Local-network management surface. Keep it on a trusted LAN only.
      - "${EVERYAPI_CONSOLE_PORT:-8421}:8421"
